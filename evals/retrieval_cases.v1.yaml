    areas: [fire, preparedness, geography]
    difficulty: harder
    question: Vi telter ved et vann i Norge i juli og vil lage et lite bål til matlaging. Er det lov her, og hvilke regler gjelder?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: insufficient_coverage
    relevant_sources: [source-13, source-12]
    preferred_source_sections: []
