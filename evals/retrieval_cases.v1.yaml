    supporting_sources: []
    must_have_information:
      - Avkjøl skadestedet med rennende, litt kjølig vann omkring 20 grader i inntil 20 minutter for en voksen.
      - Ikke bruk is eller iskaldt vann; is kan skade huden ytterligere.
      - Ikke stikk hull på blemmene.
      - Kontakt lege når hånden er brannskadet, slik kildens kriterier angir.
    acceptable_source_sections_or_chunks:
      - Passasjer med voksen avkjøling, forbud mot is/å punktere blemmer og kriteriet om lege ved håndskade er samlet tilstrekkelige.
      - Behandling og helsehjelp må begge dekkes; ingen ekstra kilder er påkrevd.
      - Krem-/salveråd inngår ikke i retrieval-gold. Tilstedeværelse, fravær eller motstrid i slike råd påvirker ikke retrieval-pass/fail; ingen avklaring av kremvalg kreves for pass.
    optional_useful_information:
      - Ikke bruke vått håndkle/klut som avkjøling.
      - Etter avkjøling dekke med ren bandasje.
      - Ikke dra av klær som sitter fast i huden.
      - Smertestillende etter kildens omtale, uten at dette erstatter førstehjelp og legekontakt.
    irrelevant_or_potentially_misleading_information:
      - Isråd fra forstuingsbehandling brukt på brannskaden.
      - Kun definisjoner av overfladisk/dyp brannskade uten behandlingsinstruksjoner.
      - Barnespesifikk avkjøling som hovedinstruksjon for en voksen.
    knowledge_gap:
      status: bounded_limitations
      details:
        - Avkjøling og behov for lege ved håndskade er dekket; tekst alene avgjør ikke faktisk skadedybde eller evakuering.
        - Førstehjelpsseksjonen anbefaler bakteriedrepende krem, men sier også at området ikke skal smøres med krem. Entydig kremveiledning mangler i denne teksten; konflikten er utenfor gold og påvirker ikke retrieval-success.
    gold_uncertainty:
      requires_owner_judgement: false
      notes:
        - Eierens QA-bestilling avklarer gold-avgrensningen til voksen avkjøling, ikke is/iskaldt vann, ikke punktere blemmer og medisinsk vurdering av håndskade. Krem-/salvekonflikten består, men krever ingen avklaring for retrieval-pass/fail og er ikke endelig behandlingspolicy.
    why_this_case_is_useful: Finner konkret handling og legekontakt fremfor symptomer; tester også risiko for feil råd fra en annen skadetype.

