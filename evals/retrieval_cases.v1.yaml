      - Instruksjoner for små sår alene er utilstrekkelige for denne pågående store blødningen.
    optional_useful_information:
      - Legge personen ned og heve den blødende kroppsdelen over hjertehøyde dersom mulig.
      - Ikke fjerne fastsittende gjenstander hvis slike finnes i såret.
      - Kildens beskrivelse av ekstra trykk med en hard gjenstand på bandasjen.
    irrelevant_or_potentially_misleading_information:
      - Skrubbsårrengjøring eller råd om små kutt som hovedkontekst.
      - Kun å vente 5-10 minutter som ved mindre blødning uten nødvendig varsling/trykk for større blødning.
      - Indre blødning som erstatning for instruksjoner om direkte trykk mot det synlige såret.
