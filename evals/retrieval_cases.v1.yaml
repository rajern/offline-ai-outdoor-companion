    review_status: pending_owner_review
    areas: [injury, first_aid]
    difficulty: straightforward
    question: Jeg er voksen og sølte akkurat kokende vann over hånda da vi laget kaffe på tur. Huden er rød og vond, og det begynner å komme blemmer. Hva gjør jeg nå?
