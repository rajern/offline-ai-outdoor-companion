  path: knowledge/local/knowledge.json
  sha256: bd954cd27111854db2a54a8b05335dac8be7776301060da2cce3dfedb2a33d20
  document_count: 22
  chunk_count: 190
  approved_manifest: knowledge/manifests/approved-sources.json
  manifest_sha256: f5e740eb53e8970cfd88868bc211be346bba1644c317894dfa0a728f90911530
  source_approval_date: '2026-10-06'
  inspection_scope: All 22 approved documents in the frozen local corpus; no retrieval outputs used.
review:
  pilot_cases: Previously owner-reviewed; cases 01-05 incorporate the two final requested changes.
  additional_cases: Cases 06-15 are proposals awaiting explicit owner review.
  safety_policy: These gold definitions do not approve or implement M3 safety policy.
rules:
  information_based: >-
    A supported-context pass requires all must-have information, including conditions and
    limitations, in geographically applicable retrieved passages. Semantically equivalent
    passages or combinations count; exact wording, document identity and chunk IDs do not
    define success. Returning the correct document without the necessary instructions is
    insufficient. The source and section references below are evidence locations, not an
    exhaustive whitelist of acceptable passages.
  supporting_sources: >-
    Supporting sources are never required for a retrieval pass if the preferred/primary
    source already covers all must-have information. Supporting sources may improve
    context, but retrieval quality should not be rewarded merely for returning more
    sources or more text.
  supporting_sources_when_needed: >-
    If primary passages omit a must-have fact, another approved, geographically applicable
    passage may supply it. The information is required, not the identity of that secondary
    source. Optional information never substitutes for missing must-have information.
  geography: >-
    Apply each case's jurisdiction. General passages and applicable Norwegian passages can
    support NO cases. NZ-specific services, laws and operational rules cannot support a
    Norwegian answer. An approved document may contain both general and country-specific
    sections. This file defines expectations; it does not modify geography filtering.
  insufficient_coverage: >-
    Cases marked insufficient_coverage have no full-answer gold context in this snapshot.
    Their must-have list describes only the supported subset, if any. Do not count them as
    ordinary retrieval passes or failures for a complete answer, including when that list
    is empty. Record the coverage gap, any supported subset, and misleading/inapplicable
    context separately. A missing fact is not a retrievable passage. Assessing whether an
    LLM acknowledges the gap belongs to a separate generation eval, not this set.
  stability: >-
    Freeze approved questions, must-have criteria and gap definitions during comparisons.
    Record set and corpus hashes for future runs. Bump the set version for approved semantic
    changes and re-review coverage if the corpus changes. Do not tune gold to retrieval results.
  scope: No retrieval runs, answer generation, model experiments or production changes are authorized by this file.

