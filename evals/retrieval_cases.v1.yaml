# Information-based retrieval gold definitions, not generated answers or eval results.
# Source IDs refer to approved documents, never to required chunk identities.
schema_version: 1
set_id: outwise-retrieval-v1
set_version: 1.0.0
created_at: '2026-10-07'
status: pending_owner_review
purpose: Evaluate local retrieval independently of LLM answer generation.
