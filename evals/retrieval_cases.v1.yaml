      - De foretrukne passasjene kan dekke den støttede delmengden, men ingen passasjekombinasjon i denne lokale basen dekker hele spørsmålet.
      - Registrer insufficient_coverage, ikke full retrieval-pass selv om begge støttede punkter finnes.
      - Lenker/overskrifter til faretegn og andre undervisningssider er ikke selve instruksjonen; innhold fra ikke-ingesterte lenker kan ikke regnes som gold.
    optional_useful_information:
      - Regionalt skredvarsel er bare utgangspunkt for lokale vurderinger; forhold kan avvike og endres raskt.
      - Skredterreng inkluderer både løsne- og utløpsområder.
    irrelevant_or_potentially_misleading_information:
