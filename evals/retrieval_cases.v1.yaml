        sections: [Personal equipment / Cooking and food equipment]
        contribution: Generelle kokeutstyrskategorier; sier ingenting om norsk lovlighet for bål eller kokeutstyr her og nå.
        sufficient_alone: false
    must_have_information: []
    acceptable_source_sections_or_chunks:
      - Ingen godkjent geografisk anvendelig passasje dekker norske bålregler/lokal lovlighet; korrekt forventet resultat er insufficient_coverage.
      - Den tomme must-have-listen betyr at relevant norsk rettslig informasjon mangler, ikke automatisk pass.
      - DOCs Fires on public conservation land er godkjent, men de lokale passasjene er NZ-spesifikke og kan ikke gi norsk gold.
      - Generelt kokeutstyr kan være valgfri støtte, men dekker ikke lovligheten og skal ikke gi bonus for flere treff.
    optional_useful_information:
      - Generelle utstyrskategorier som kokeapparat/drivstoff og vannbehandlingsutstyr, uten påstand om tillatt bruk.
    irrelevant_or_potentially_misleading_information:
      - NZ-regler om DOC-hytter, tillatte ildsteder, bålstørrelse/avstand og FENZ-tillatelser fremstilt som norske regler.
      - Påstanden om at gassapparat vanligvis kan brukes fra NZ-kilden som norsk tillatelse.
      - En universell tillatelse basert på at bålet er lite eller at stedet er ved vann.
      - Norske kalenderregler, unntak eller aktuelle lokale forbud hentet fra modellminne fremfor godkjent kilde.
    knowledge_gap:
      status: insufficient_coverage
      details:
        - Norske nasjonale bålregler og unntak er ikke dekket av den godkjente lokale kunnskapsbasen.
        - Aktuelle lokale forbud, verne-/grunneierregler, brannfare og nøyaktig tursted er ikke dekket/oppgitt.
        - Hele DOC-brannartikkelen er merket NZ i den lokale basen; korrekt geografi må bevares selv om teksten er tematisk relevant.
    gold_uncertainty:
      requires_owner_judgement: false
      notes:
        - Dette er en dokumentert jurisdiksjons-/dekningsmangel, ikke et forslag til norske regler. Eier skal godkjenne negativcasen før bruk.
    why_this_case_is_useful: Tester at tematisk riktig men jurisdiksjonsfeil kildestoff ikke blir godkjent som norsk veiledning.
