  - id: control-01
    title: Gjennomføre voksen-HLR etter pustevurdering
    origin: procedural_holdout
    review_status: pending_owner_review
    areas: [first_aid, rescue]
    difficulty: harder
    question: Vi har ringt 113. En voksen ligger bevisstløs, og vi har sjekket at hun ikke puster normalt. Vi får beskjed om å starte HLR. Hvordan gjør vi selve kompresjonene og innblåsingene mens vi venter?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-01]
    preferred_source_sections:
      - source_id: source-01
        sections: [Hjerte- og lungeredning på voksne / Legg personen på gulvet og sjekk pusten, Hjerte- og lungeredning på voksne / 30 brystkompresjoner, Hjerte- og lungeredning på voksne / To innblåsinger, Hjerte- og lungeredning på voksne / HLR 30 + 2]
        sufficiency: Actual adult compression/ventilation instructions rather than normal-breath side position.
    supporting_sources: []
    must_have_information:
      - Personen skal ligge på ryggen på hardt underlag; hendene plasseres oppå hverandre midt på brystkassen.
      - Gi 30 kompresjoner med 100-120 per minutt og 5-6 cm dybde, med full avlastning mellom trykkene.
      - Gi to forsiktige innblåsinger med fri luftvei, nesen lukket og munn dekket; brystheving viser tilstrekkelig luft.
      - Fortsett å veksle 30 kompresjoner og to innblåsinger til ambulansepersonell overtar.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / Legg personen på gulvet og sjekk pusten, quote: 'Personen må ligge på ryggen på hardt underlag når du skal gjøre HLR.'}
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / 30 brystkompresjoner, quote: 'Legg dine hender oppå hverandre midt på brystkassen til personen.'}
      - item: 2
        all_of:
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / 30 brystkompresjoner, quote: 'Gi 30 brystkompresjoner.'}
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / 30 brystkompresjoner, quote: 'Takten skal være 100-120 trykk per minutt.'}
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / 30 brystkompresjoner, quote: 'Du skal trykke hardt ned, 5-6 cm, bruk strake armer for å trykke hardt nok.'}
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / 30 brystkompresjoner, quote: 'Pass på å slippe helt opp mellom hver brystkompresjon slik at du ikke lener deg på brystkassen.'}
      - item: 3
        all_of:
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / To innblåsinger, quote: 'Hold fri luftvei ved å bøye hodet til personen litt bakover og løfte haken frem.'}
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / To innblåsinger, quote: 'Hold for nesen og dekk hele personens munn med din munn.'}
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / To innblåsinger, quote: 'Gjør to forsiktige innblåsinger.'}
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / To innblåsinger, quote: 'Det er nok luft når du ser at brystet hever seg.'}
      - item: 4
        all_of:
          - {source_id: source-01, section: Hjerte- og lungeredning på voksne / HLR 30 + 2, quote: 'Fortsett å veksle mellom 30 brystkompresjoner og to innblåsinger til ambulansepersonellet overtar.'}
    acceptable_source_sections_or_chunks: [Alle utførelseskrav må dekkes med voksenbetingelse; sideleie/113 alene eller barneprosedyrer er utilstrekkelige.]
    optional_useful_information: [Telefon på høyttaler., 113 veileder om hjertestarter når flere kan hjelpe.]
    irrelevant_or_potentially_misleading_information: [Barne-/babykompresjoner eller normal-pust-sideleie som erstatning for voksen-HLR., En faktisk levert ratio uten dybde/tempo/full avlastning gir ikke full kompresjonsscore.]
    knowledge_gap: {status: bounded_limitations, details: [Kildeinstruksjonen er dekket; brukerens praktiske utførelse og faktiske tilstand kan ikke vurderes.]}
    gold_uncertainty: {requires_owner_judgement: false, notes: []}
    why_this_case_is_useful: Annet informasjonsbehov enn utviklingscasets voksen pustevurdering og sideleie; detaljerte kvantitative konjunksjoner.

  - id: control-02
    title: Pustevurdering hos sterkt nedkjølt
    origin: procedural_holdout
    review_status: pending_owner_review
    areas: [cold, exposure, first_aid]
    difficulty: harder
    question: En turkamerat ble funnet bevisstløs etter å ha ligget lenge i kulda. Vi ser nesten ingen pust og har ringt 113. Gjelder en rask pustesjekk her, og hvordan bør vi håndtere personen?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-05]
    preferred_source_sections:
      - source_id: source-05
        sections: [Slik gir du førstehjelp ved nedkjøling, Slik gir du førstehjelp ved nedkjøling / Sjekk pusten hos den nedkjølte, Hjertestans på grunn av nedkjøling]
        sufficiency: Cold-specific assessment duration and handling/HLR endpoint together suffice.
    supporting_sources: []
    must_have_information:
      - Pust kan være svært langsom ved nedkjøling; hold fri luftvei og det kan være nødvendig å sjekke et helt minutt før man konkluderer med at personen ikke puster.
      - Alvorlig nedkjølte behandles skånsomt med minst mulig bevegelse, helst liggende.
      - Ved hjertestans som skyldes nedkjøling startes HLR og den fortsettes til helsepersonell overtar.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-05, section: Slik gir du førstehjelp ved nedkjøling / Sjekk pusten hos den nedkjølte, quote: 'Det kan være vanskelig å finne ut om en bevisstløs person puster, fordi vi puster mye saktere når vi er nedkjølt.'}
          - {source_id: source-05, section: Slik gir du førstehjelp ved nedkjøling / Sjekk pusten hos den nedkjølte, quote: 'Det kan være nødvendig at du holder fri luftvei og sjekker pusten i et helt minutt, før du kan konkludere med at en person ikke puster.'}
      - item: 2
        all_of:
          - {source_id: source-05, section: Slik gir du førstehjelp ved nedkjøling, quote: 'Prøv å behandle alvorlig nedkjølte skånsomt, uten for mye bevegelser og helst mens de ligger.'}
      - item: 3
        all_of:
          - {source_id: source-05, section: Hjertestans på grunn av nedkjøling, quote: 'Har en person fått hjertestans på grunn av nedkjøling, må du starte hjerte- og lungeredning.'}
          - {source_id: source-05, section: Hjertestans på grunn av nedkjøling, quote: 'Hold på med hjerte- og lungeredning helt til helsepersonell overtar.'}
    acceptable_source_sections_or_chunks: [Kuldens særlige pustevurdering og skånsom håndtering må faktisk finnes; generell 10-sekundersregel alene er feil for dette behovet.]
    optional_useful_information: [Isolerende vind-/damptett innpakking og varme uten direkte hudkontakt., Opplysninger om kuldevarighet/temperatur/hendelsesforløp.]
    irrelevant_or_potentially_misleading_information: [Bevegelsesråd fra våken isredning brukt på alvorlig nedkjølt bevisstløs., Ti sekunder fremstilt som tilstrekkelig regel for den beskrevne kuldesituasjonen.]
    knowledge_gap: {status: bounded_limitations, details: [Unntaket er dekket; faktisk hjertestans og temperatur kan ikke diagnostiseres fra spørsmålet.]}
    gold_uncertainty: {requires_owner_judgement: false, notes: [Sikkerhetskritisk unntak må eiergjennomgås før senere bruk.]}
    why_this_case_is_useful: Tester betinget unntak, ikke repetisjon av våken skjelvende person eller normal temperatur/sideleie.

