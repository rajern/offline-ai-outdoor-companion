  - id: control-04
    title: Hjelpe annen person gjennom isen
    origin: procedural_holdout
    review_status: pending_owner_review
    areas: [ice, rescue, natural_hazard]
    difficulty: harder
    question: Jeg står på isen og ser en annen som har falt i vannet noen meter unna. Jeg har kasteline, men vet ikke om isen mellom oss holder. Hvordan prøver jeg å hjelpe uten å havne i vannet selv?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-19]
    preferred_source_sections:
      - source_id: source-19
        sections: [Redde andre]
        sufficiency: Caller uncertainty, distance and reaching aids jointly sufficient for initial safe help.
    supporting_sources: []
    must_have_information:
      - Uten full kontroll på situasjonen ringes 113 før redningen hvis mulig.
      - Unngå at enda en person havner i vannet; hold avstand og bruk hjelpemidler fra is som bærer godt fremfor farlig tynn is.
      - Kasteline/tau kan kastes ut for å nå personen; lang grein eller stige er et alternativ.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-19, section: Redde andre, quote: 'Hvis man ikke har 100 % kontroll på situasjonen må man (om mulig) ringe 113 (ambulanse/kommunikasjonssentralen) før man begynner redningen.'}
      - item: 2
        all_of:
          - {source_id: source-19, section: Redde andre, quote: 'Det viktigste å huske på er at man må prøve å unngå at enda en person havner i vannet, noe som gjør situasjonen mye mer uoversiktlig.'}
          - {source_id: source-19, section: Redde andre, quote: 'Hold derfor avstand og bruk hjelpemidler som gjør at redningsmannskapene ikke trenger å være på farlig tynn is.'}
          - {source_id: source-19, section: Redde andre, quote: 'Redningsmannskapene kan gå så langt ut som isen bærer godt.'}
      - item: 3
        all_of:
          - {source_id: source-19, section: Redde andre, quote: 'Kast ut et tau (kasteline eller tau med kraftig pinne i enden).'}
    acceptable_source_sections_or_chunks: [Minst én relevant rekkeviddemetode sammen med varsling og hjelperens sikkerhet; flere teknikker eller kilder kreves ikke.]
    optional_useful_information: [Lang grein/stige., Kilden omtaler siste-utvei-kjede som risikabel, ikke normal metode.]
    irrelevant_or_potentially_misleading_information: [Egenredning i vannet som erstatning for hjelperens fremgangsmåte., Liggende menneskekjede uten siste-utvei-/risikoforbehold., Lokalt garantert bæreevne uten måling.]
    knowledge_gap: {status: bounded_limitations, details: [Innledende råd er dekket; faktisk istykkelse og trygg rekkevidde er ukjent.]}
    gold_uncertainty: {requires_owner_judgement: false, notes: []}
    why_this_case_is_useful: Annen aktør og risikobetingelse enn egenredningscaset, ikke bare ny ordlyd.

  - id: control-05
    title: Utløpsområde under bratt fjellside
    origin: procedural_holdout
    review_status: pending_owner_review
    areas: [avalanche, navigation, preparedness]
    difficulty: harder
    question: Vi planlegger en skitur som går på flata nedenfor en bratt fjellside. Betyr flatt terreng at vi er utenfor skredterreng, og hvordan bør vi bruke kart og regionalt skredvarsel i planleggingen?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-16]
    preferred_source_sections:
      - source_id: source-16
        sections: [Bruk bratthets- og utløpssonekart, Turplanleggingen starter hjemme - bruk snøskredvarselet og planlegg turen]
        sufficiency: Release/runout distinction and regional-to-local planning limitations.
    supporting_sources: []
    must_have_information:
      - Skredterreng omfatter både løsneområder og utløpsområder nedenfor; bare egen flat helning er ikke nok til å avklare risiko.
      - Bratthets-/utløpskart kan vise terreng over 27 grader og utløpsområder under slikt terreng.
      - Regionalt skredvarsel er utgangspunkt for lokale vurderinger; forhold kan skifte raskt og være annerledes enn varslet.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-16, section: Bruk bratthets- og utløpssonekart, quote: 'Skredterreng er både løsne og utløpsområder.'}
      - item: 2
        all_of:
          - {source_id: source-16, section: Bruk bratthets- og utløpssonekart, quote: 'Du kan se terreng over 27 grader bratt, og utløpsområdene under slikt terreng på kart i Varsom-regobs app.'}
      - item: 3
        all_of:
          - {source_id: source-16, section: Turplanleggingen starter hjemme - bruk snøskredvarselet og planlegg turen, quote: 'Varsom.no publiserer et regionalt varsel. Du må bruke dette som utgangspunkt for lokale vurderinger.'}
          - {source_id: source-16, section: Turplanleggingen starter hjemme - bruk snøskredvarselet og planlegg turen, quote: 'Husk at forholdene kan skifte raskt og være annerledes enn varslet.'}
    acceptable_source_sections_or_chunks: [Generell terrengdefinisjon og kart-/varselbegrensninger må dekkes; ingen aktuell rute eller faregrad er gold.]
    optional_useful_information: [Planlegg annen vei hvis turens skredterreng er i varslets mest utsatte terreng., Reserveplaner og gruppeavklaring.]
    irrelevant_or_potentially_misleading_information: [Flatt terreng eller 27-graders kartgrense som garanti mot skred., Utstyrsliste eller kameratredning som erstatning for terrengforståelse., Statisk lenke fremstilt som aktuelt varsel.]
    knowledge_gap: {status: bounded_limitations, details: [Begrepene er dekket; faktisk utløpssone for denne turen og dagens fare er ukjent.]}
    gold_uncertainty: {requires_owner_judgement: false, notes: [27 grader er kartets visningsgrense i kilden, ikke gold for en sikker helningsgrense.]}
    why_this_case_is_useful: Romlig risikobegrep og kvalifikasjoner, klart forskjellig fra redningsutstyr og drønn/retrett-gap.

