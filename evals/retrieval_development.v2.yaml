cases:
- id: case-01
  title: Ankelskade med mulig brudd
  origin: approved_pilot
  review_status: owner_reviewed_with_requested_revisions
  areas:
  - injury
  - first_aid
  difficulty: harder
  question: Jeg tråkket over på tur. Ankelen har hovnet opp, og jeg klarer ikke å stå på foten. Hva bør jeg gjøre
    nå?
  question_language: nb
  jurisdiction: 'NO'
  expected_result: supported_context
  relevant_sources:
  - source-04
  - source-05
  preferred_source_sections:
  - source_id: source-04
    sections:
    - Hva er brudd?
    - 'Hva er brudd? / Førstehjelp ved brudd:'
    sufficiency: Together sufficient for all must-have information.
  supporting_sources:
  - source_id: source-04
    sections:
    - 'Hva er forstuing? / Førstehjelp ved forstuing:'
    - Legevakt
    contribution: Ro/avlastning, supplerende forstuingsråd og kontaktinformasjon.
    sufficient_alone: false
  - source_id: source-05
    sections:
    - Førstehjelp ved nedkjøling
    contribution: Forebygge nedkjøling hos skadde.
    sufficient_alone: false
  must_have_information:
  - Manglende evne til å stå på den skadde foten gir grunn til å mistenke brudd.
  - Forstuing og brudd kan være vanskelig å skille.
  - Mistanke om brudd krever vurdering av lege eller legevakt.
  - Hold området i ro og unngå belastning/unødvendig bevegelse; bevegelse kan forverre skaden og smerten.
  acceptable_source_sections_or_chunks:
  - Passasjer om bruddmistanke og førstehjelp ved brudd dekker samlet kravene.
  - RICE kan bidra med ro/avlastning, men erstatter ikke bruddmistanke og medisinsk vurdering.
  - All approved, applicable passages collectively covering the must-have facts count; supporting sources are not
    required if primary context is complete.
  optional_useful_information:
  - Holde den skadde varm.
  - Foreløpig støtte/spjelking uten press på skadestedet.
  - 116 117 og relevant nødtelefoninformasjon.
  - Supplerende forstuingsråd uten å erstatte bruddveiledningen.
  irrelevant_or_potentially_misleading_information:
  - Beskrivelse av forstuet ankel alene, eller RICE alene uten bruddmistanke og medisinsk vurdering.
  - Gradvis økt belastning som om personen allerede var i bedring.
  - Håndleddsbrudd, gipsbehandling og generelle navigasjonsråd.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Innledende førstehjelp og behov for medisinsk vurdering er godt dekket.
    - Konkret evakuering/transport når personen ikke kan gå fra et avsides tursted, er ikke godt dekket.
  gold_uncertainty:
    requires_owner_judgement: false
    notes: []
  why_this_case_is_useful: Skiller vurdering og behandling av mulig brudd fra treff som bare nevner ankel/forstuing.
- id: case-02
  title: Gjennomvåt og kald turkamerat
  origin: approved_pilot
  review_status: owner_reviewed_with_requested_revisions
  areas:
  - cold
  - exposure
  - first_aid
  difficulty: straightforward
  question: Vi har gått lenge i regn og vind. Turkameraten min er gjennomvåt og skjelver kraftig, men er våken og
    snakker normalt. Vi har sovepose og fjellduk. Hvordan hjelper jeg ham nå?
  question_language: nb
  jurisdiction: 'NO'
  expected_result: supported_context
  relevant_sources:
  - source-05
  - source-12
  - source-19
  preferred_source_sections:
  - source_id: source-05
    sections:
    - Slik gir du førstehjelp ved nedkjøling
    sufficiency: Sufficient alone for all must-have information.
  supporting_sources:
  - source_id: source-12
    sections:
    - Personal equipment
    contribution: Generelt utstyr for sovepose, isolasjon og nødly; ikke behandling.
    sufficient_alone: false
  - source_id: source-19
    sections:
    - Etter redningen
    contribution: Vått tøy av, tørt tøy på og isolasjon etter isredning; konteksten må bevares.
    sufficient_alone: false
  - source_id: source-05
    sections:
    - Symptomer på nedkjøling
    contribution: Symptomoversikt; ikke erstatning for førstehjelp.
    sufficient_alone: false
  must_have_information:
  - Fjern vått tøy og begrens videre varmetap.
  - Pakk personen inn i isolerende materiale med vind- og damptett beskyttelse mot vind og fukt.
  - Tilfør varme; eksterne varmekilder skal ikke ligge direkte mot huden.
  - Overvåk bevissthet og pust.
  - Ring 113 for veiledning, slik førstehjelpskilden anbefaler.
  acceptable_source_sections_or_chunks:
  - Helsenorges førstehjelpsseksjon er tilstrekkelig alene.
  - Likeverdige passasjer eller kombinasjoner som dekker alle must-have-punktene kan godtas; støttepassasjer er
    ikke påkrevd.
  - Utstyrslister, symptomer eller etterbehandling ved isredning alene dekker ikke kravene.
  optional_useful_information:
  - Få personen innendørs eller i ly dersom mulig.
  - Våkenhet og skjelving er forenlig med mildere nedkjøling i symptomoversikten.
  - Knytte tilgjengelig sovepose/fjellduk til isolasjon og vindbeskyttelse.
  - Alternativ innpakking dersom isolerende materiale mangler.
  irrelevant_or_potentially_misleading_information:
  - HLR/bevisstløshet som hovedkontekst når personen er våken og snakker normalt.
  - Heteslag/dehydrering eller utstyrslister uten behandlingsråd.
  - Bare beskrivelser av hvor farlig nedkjøling er.
  - Ukritisk generalisering av råd om bevegelse fra etterbehandling ved isredning.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Grunnleggende førstehjelp er godt dekket; detaljerte evakueringsbeslutninger fra avsides tursteder er ikke
      godt dekket.
  gold_uncertainty:
    requires_owner_judgement: false
    notes: []
  why_this_case_is_useful: Finner praktisk behandling av kuldeeksponering fremfor bare symptomer eller utstyr.
- id: case-03
  title: Drikkevann fra bekk med ukjent høyde
  origin: approved_pilot
  review_status: owner_reviewed_with_requested_revisions
  areas:
  - water
  difficulty: harder
  question: Vi har gått tomme for drikkevann på tur. Bekken ser helt ren ut, og vi har stormkjøkken. Kan vi bruke
    vannet derfra, og hva bør vi gjøre med det først?
  question_language: nb
  jurisdiction: 'NO'
  expected_result: supported_context
  relevant_sources:
  - source-21
  - source-12
  preferred_source_sections:
  - source_id: source-21
    sections:
    - Exposure / Clear water can be unsafe
    - Key points
    - Overview
    - Prevention steps and strategies / Treat your water
    - Prevention steps and strategies / Treat your water / Boil
    sufficiency: Clear-water risk, treatment need, chemical limitation and full boiling rule together suffice; Key
      points and Overview are alternatives for treatment need.
  supporting_sources:
  - source_id: source-12
    sections:
    - Personal equipment / Cooking and food equipment
    contribution: Utstyr til koking/vannbehandling; ikke selve prosedyren.
    sufficient_alone: false
  must_have_information:
  - Vann som ser rent ut, kan inneholde sykdomsfremkallende mikroorganismer.
  - Vann med usikker trygghet bør behandles.
  - For klart vann ved høyder opptil og med 6 500 fot skal vannet fosskoke i ett minutt for å drepe mikroorganismer.
  - Over 6 500 fot skal klart vann fosskoke i tre minutter for å drepe mikroorganismer.
  - Koking/desinfisering gjør ikke vann med skadelige kjemikalier eller giftstoffer trygt; ved mistanke om slik
    forurensning må en annen vannkilde brukes.
  acceptable_source_sections_or_chunks:
  - Passasjer som samlet dekker klart/usikkert vann, begge høydebetingelsene for koking og begrensningen ved kjemisk
    forurensning.
  - CDC er tilstrekkelig uten DOC; en generell oppsummering uten kokeprosedyre og begrensninger er ikke tilstrekkelig.
  - Likeverdige opplysninger og korrekte enhetsomregninger kan godtas; eksakt ordlyd eller chunk-identitet kreves
    ikke.
  optional_useful_information:
  - Avkjøl vannet før bruk for å unngå brannskader.
  - Filtrering etterfulgt av desinfisering som alternativ metode.
  - Utstyrsanbefalinger fra DOC.
  irrelevant_or_potentially_misleading_information:
  - Håndvask, toalettavfall eller sykdomssymptomer som hovedkontekst.
  - Filterdetaljer som erstatter kokeprosedyren når stormkjøkken er tilgjengelig.
  - Klart vann fremstilt som sikkert eller koking fremstilt som fjerning av all forurensning.
  - Ettminuttsregelen uten høydeforbehold; høyden er ikke oppgitt.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Generell behandling mot mikroorganismer er dekket; faktisk lokal/kjemisk forurensning kan ikke avgjøres.
    - Turstedets høyde er ukjent i spørsmålet, ikke en manglende regel i kunnskapsbasen. Retrieval må gi begge reglene;
      senere LLM må håndtere ukjent høyde.
  gold_uncertainty:
    requires_owner_judgement: false
    notes: []
  why_this_case_is_useful: Norsk spørsmål mot engelsk prosedyre med nødvendige betingelser og behandlingsbegrensninger.
- id: case-04
  title: Mistet stien i tåke
  origin: approved_pilot
  review_status: owner_reviewed_with_requested_revisions
  areas:
  - lost
  - navigation
  - emergency_signalling
  difficulty: harder
  question: Vi har mistet den merkede stien i tåka. Vi er usikre på hvor vi tok feil, og ser ikke noe vi kjenner
    igjen. Hva bør vi gjøre nå?
  question_language: nb
  jurisdiction: 'NO'
  expected_result: supported_context
  relevant_sources:
  - source-09
  - source-11
  - source-10
  - source-12
  preferred_source_sections:
  - source_id: source-09
    sections:
    - Reduce your risk of getting lost / If you get lost
    sufficiency: The general section is sufficient alone; other sections contain NZ-specific material.
  supporting_sources:
  - source_id: source-11
    sections:
    - Why you should take one
    - Call for help early
    contribution: Kun betinget støtte hvis nødpeiler finnes og situasjonen tilsier bruk.
    sufficient_alone: false
  - source_id: source-10
    sections:
    - Five simple steps / 2. Understand the weather
    - Five simple steps / 3. Pack warm clothes and extra food
    contribution: Generell beredskap; hovedsakelig forebyggende.
    sufficient_alone: false
  - source_id: source-12
    sections:
    - Personal equipment
    contribution: Kart/kompass, nødly og annet utstyr; ingen konkret returmetode.
    sufficient_alone: false
  must_have_information:
  - Ikke fortsett inn i ukjent terreng i håp om å finne veien.
  - Stopp og vurder situasjonen.
  - Bli der dere er dersom dere ikke er sikre på veien ut.
  - Ivareta gruppens sikkerhet og varme, og lag ly ved behov.
  - Søk hjelp og gjør dere synlige.
  acceptable_source_sections_or_chunks:
  - If you get lost dekker alle kravene alene; flere kilder er ikke nødvendig.
  - Andre geografisk anvendelige passasjer kan kollektivt dekke kravene.
  - Land Safety Code, utstyrslister og nødpeilerråd alene erstatter ikke handlinger etter å ha gått seg bort.
  optional_useful_information:
  - Spise og drikke; førstehjelp ved skade.
  - Tilgjengelig kart-/navigasjonsutstyr som kan brukes forsvarlig.
  - Betinget bruk av nødpeiler.
  - Rådet om samlet gruppe finnes i Land Safety Code, men den aktuelle lokale passasjen er merket NZ og er ikke
    et obligatorisk norsk gold-kriterium.
  irrelevant_or_potentially_misleading_information:
  - Forhåndsnedlasting av kart/deling av turplan som hovedsvar.
  - New Zealand-spesifikke nødnumre, kart og tjenester.
  - En bestemt retning eller bare å gå samme vei tilbake uten posisjons-/rutegrunnlag.
  - Nødpeilerinstruksjoner som dominerer uten opplysninger om tilgjengelig utstyr.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Innledende handlinger er godt dekket; faktisk posisjon og konkret returvei kan ikke bestemmes.
    - Detaljerte teknikker for ruterekonstruksjon/navigasjon tilbake er begrenset.
  gold_uncertainty:
    requires_owner_judgement: false
    notes: []
  why_this_case_is_useful: Norsk spørsmål mot engelsk handlingsseksjon, med skille mellom aktive råd, forebygging
    og geografisk støy.
- id: case-05
  title: Torden på fjellrygg
  origin: approved_pilot
  review_status: owner_reviewed_with_requested_revisions
  areas:
  - natural_hazard
  - weather
  - shelter
  difficulty: harder
  question: På vei over en fjellrygg begynner det å tordne. Vi ser et lite overheng der vi kan vente, men bilen
    står nede ved parkeringen. Hva bør vi gjøre?
  question_language: nb
  jurisdiction: 'NO'
  expected_result: supported_context
  relevant_sources:
  - source-22
  - source-10
  preferred_source_sections:
  - source_id: source-22
    sections:
    - 'Lightning: What You Need to Know'
    - Last Resort Outdoor Risk Reduction Tips
    sufficiency: Together sufficient for all must-have information.
  supporting_sources:
  - source_id: source-10
    sections:
    - Five simple steps / 2. Understand the weather
    contribution: Generell vær-/beredskapskontekst; ingen lynspesifikke handlinger.
    sufficient_alone: false
  must_have_information:
  - Hørbar torden betyr at lyn er nær nok til å være farlig.
  - Ingen utendørsplass skal behandles som trygg under tordenvær.
  - Kom bort fra rygger, topper og annet høyt terreng.
  - Et klippeoverheng er ikke trygt ly mot lyn.
  - Ordentlig ly er en egnet solid bygning med elektrisitet/røranlegg eller et lukket kjøretøy med metalltak og
    vinduene oppe.
  - Hvis ordentlig ly ikke kan nås, reduserer utendørstiltak bare risikoen; de gjør ikke stedet trygt.
  acceptable_source_sections_or_chunks:
  - De to lynseksjonene dekker kravene samlet uten DOC-støtte.
  - Likeverdige passasjer eller kombinasjoner må dekke både handlingene og begrensningene; generelle ly-råd alene
    er utilstrekkelige.
  optional_useful_information:
  - Vent minst 30 minutter etter siste torden før dere forlater ordentlig ly.
  - Ikke ligg flatt; unngå enslige trær.
  - Hold avstand til vann og ledende gjenstander der relevant.
  irrelevant_or_potentially_misleading_information:
  - Regn-/vindly som fremstiller overhenget som trygt mot lyn, eller råd om å vente under det.
  - Værplanlegging før turen eller innendørsråd som hovedkontekst.
  - Påstander om at en bestemt utendørsposisjon er trygg.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Generell lynsikkerhet er dekket; sikreste nedstigningsrute, gjennomførbarhet av å nå bilen nå og tidsbruk
      til ly kan ikke bestemmes.
  gold_uncertainty:
    requires_owner_judgement: false
    notes: []
  why_this_case_is_useful: Farespesifikt engelsk kildestoff må overstyre misvisende generelle ly-råd og bevare usikkerhet.
