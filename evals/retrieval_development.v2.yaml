  - Revers osmose brukt som om det beskriver dette filteret.
  - Virusfjerning tilskrevet 0.3-mikronfilter.
  - Tablettdose eller virketid uten produktinformasjon.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Generell metode er dekket; konkret tablettdose og tid avhenger av produkt og er ikke gold.
  gold_uncertainty:
    requires_owner_judgement: false
    notes: []
  why_this_case_is_useful: Norsk spørsmål med tall og negasjon mot engelsk prosedyre, adskilt fra tidligere koke-case.
- id: case-22
  title: Telefonkart på tur i New Zealand
  origin: development_addition
  review_status: pending_owner_review
  areas:
  - navigation
  - preparedness
  - geography
  difficulty: harder
  question: Jeg skal på flerdagerstur i New Zealand og vil bruke mobilen som kart. Hva må jeg ordne før avreise
    hvis det ikke er dekning og batteriet kan gå tomt?
  question_language: nb
  jurisdiction: NZ
  expected_result: supported_context
  relevant_sources:
  - source-09
  preferred_source_sections:
  - source_id: source-09
    sections:
    - Map apps
    sufficiency: Local map suitability, offline check, battery and paper backup all appear here.
  supporting_sources: []
  must_have_information:
  - Bruk egnet kartapp med offlinefunksjon, topografisk visning og dekning av New Zealands turområder/stier og terreng.
  - Last ned kart og kontroller at de virker offline før turen.
  - Sørg for nok batteritid og ha papirkart som reserve dersom telefonen skades eller går tom.
  must_have_evidence:
  - item: 1
    all_of:
    - source_id: source-09
      section: Map apps
      quote: 'Choose a reliable option that:'
    - source_id: source-09
      section: Map apps
      quote: works offline
    - source_id: source-09
      section: Map apps
      quote: shows all New Zealand backcountry areas
    - source_id: source-09
      section: Map apps
      quote: includes a topographic map view
    - source_id: source-09
      section: Map apps
      quote: shows tracks, terrain and other important features clearly
  - item: 2
    all_of:
    - source_id: source-09
      section: Map apps
      quote: We recommend downloading maps and checking they work offline before your trip.
  - item: 3
    all_of:
    - source_id: source-09
      section: Map apps
      quote: If you’re relying on your phone for navigation, make sure you will have enough battery life and carry
        a paper backup in case your phone gets damaged or runs out of charge.
  acceptable_source_sections_or_chunks:
  - Anvendelig NZ-kontekst med alle informasjonsbehov; passagegeografi skal følge eksplisitt NZ-spørsmål og ikke
    fast default NO.
  optional_useful_information:
  - Detaljerte Topo50-papirkart omtalt i NZ-kilden.
  - Navigasjonsutstyr må kunne brukes.
  irrelevant_or_potentially_misleading_information:
  - Handlinger etter å ha gått seg bort i stedet for forberedelse.
  - Norsk kartdekning som erstatning for NZ.
  - Valg av bestemt app som ikke anbefales i den godkjente teksten.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Planlegging er dekket; lokale appvalg/priser og rutens aktuelle forhold er ikke gold.
  gold_uncertainty:
    requires_owner_judgement: false
    notes:
    - NZ er valgt før retrieval for å teste at geografi ikke alltid hardkodes til NO.
