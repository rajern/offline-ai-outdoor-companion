    akutt bortkommet gruppe.
- id: case-23
  title: Vente i lynsikkert ly
  origin: development_addition
  review_status: pending_owner_review
  areas:
  - weather
  - shelter
  - natural_hazard
  difficulty: straightforward
  question: Vi har søkt inn i en solid bygning med strøm og vann etter tordenvær. Det har vært stille i ti minutter.
    Kan vi gå ut igjen, og er det noe inne vi bør holde oss unna mens vi venter?
  question_language: nb
  jurisdiction: 'NO'
  expected_result: supported_context
  relevant_sources:
  - source-22
  preferred_source_sections:
  - source_id: source-22
    sections:
    - 'Lightning: What You Need to Know'
    - Indoor Lightning Safety
    sufficiency: Waiting duration and two principal indoor contact hazards suffice.
  supporting_sources: []
  must_have_information:
  - Bli i ordentlig ly minst 30 minutter etter siste hørbare torden.
  - Unngå ledningstelefon og elektrisk utstyr som gir direkte elektrisk kontakt.
  - Unngå røranlegg som vasker, badekar og kraner mens uværet pågår.
  must_have_evidence:
  - item: 1
    all_of:
    - source_id: source-22
      section: 'Lightning: What You Need to Know'
      quote: Stay in safe shelter at least 30 minutes after you hear the last sound of thunder.
  - item: 2
    all_of:
    - source_id: source-22
      section: Indoor Lightning Safety
      quote: Stay off corded phones, computers and other electrical equipment that put you in direct contact with
        electricity.
  - item: 3
    all_of:
    - source_id: source-22
      section: Indoor Lightning Safety
      quote: Avoid plumbing, including sinks, baths and faucets.
  acceptable_source_sections_or_chunks:
  - Ventetid med korrekt startpunkt og innendørs risikoinstruksjoner må leveres; utendørs rygg/overheng alene er
    utilstrekkelig.
  optional_useful_information:
  - Unngå vinduer/dører/veranda og betonggulv/-vegger slik kilden beskriver.
  irrelevant_or_potentially_misleading_information:
  - Korte stillhetsperioder som klarsignal.
  - Råd om telt eller overheng som erstatning for innendørsråd.
  - Påstand om at batteridrevet telefon er forbudt basert på råd om ledningstelefon.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Generelle råd er dekket; faktisk værutvikling kan ikke fastslås fra KB.
  gold_uncertainty:
    requires_owner_judgement: false
    notes: []
  why_this_case_is_useful: Tester tidsforbehold og innendørs fase, ikke gjentakelse av akutt rygg/overheng-case.
- id: case-24
  title: Tursti langs erodert skråning under flom
  origin: development_addition
  review_status: pending_owner_review
  areas:
  - natural_hazard
  - flood
  - landslide
  difficulty: harder
  question: Etter kraftig regn går stien langs en bratt skråning med løs jord helt inntil bekken. Vannet har gravd
    ut kanten og strømmer kraftig. Hvilke farer bør vi holde oss unna på denne delen av turen?
  question_language: nb
  jurisdiction: 'NO'
  expected_result: supported_context
  relevant_sources:
  - source-20
  preferred_source_sections:
  - source_id: source-20
    sections:
    - Under en flom eller et skred
    sufficiency: Stay away from high-flow water and loose steep banks, with erosion rationale.
  supporting_sources: []
  must_have_information:
  - Unngå å oppholde dere nær elver/bekker med stor vannføring.
  - Unngå bratte skråninger med løsmasser; erosjon langs elve-/bekkeløp kan utløse skred.
  must_have_evidence:
  - item: 1
    all_of:
    - source_id: source-20
      section: Under en flom eller et skred
      quote: Frarådes det å oppholde seg i nærheten av og kryssing av elver og bekker med stor vannføring eller
        isgang.
  - item: 2
    all_of:
    - source_id: source-20
      section: Under en flom eller et skred
      quote: Unngå bratte skråninger med løsmasser, og elver og bekker med stor vannføring, fordi erosjon langs
        elve- og bekkeløp kan utløse skred.
  acceptable_source_sections_or_chunks:
  - Aktuell fare-/unngåelsesinformasjon må finnes; husholdningsflomsikring dekker ikke behovet.
  optional_useful_information:
  - Følg oppdatert lokal myndighetsinformasjon og farevarsel når tilgjengelig
  - uten å behandle lenker som aktuelt varsel.
  irrelevant_or_potentially_misleading_information:
  - Rense sluk og flytte møbler/rundballer som hovedkontekst.
  - Vadingsteknikk eller bestemt trygg returretning uten lokalt grunnlag.
  knowledge_gap:
    status: bounded_limitations
    details:
    - Generelle farer er dekket; faktisk skredstabilitet og sikker alternativ tursti kan ikke bestemmes.
  gold_uncertainty:
    requires_owner_judgement: false
    notes: []
  why_this_case_is_useful: Skiller ferdselsrelevant flom/erosjon fra mye eiendomsstoff i samme dokument; annet behov
    enn selve elvekryssingen.
