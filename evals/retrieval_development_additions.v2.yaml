  - id: case-16
    title: Skittent skrubbsår på kneet
    origin: development_addition
    review_status: pending_owner_review
    areas: [injury, first_aid, hygiene]
    difficulty: straightforward
    question: Jeg skled på grusen og fikk et skrubbsår på kneet. Det blør nesten ikke, men det sitter sand i såret og vi skal gå videre. Hvordan får jeg det rent og beskytter det?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-02]
    preferred_source_sections:
      - source_id: source-02
        sections: [Behandling av mindre blødingar og sår / Skrubbsår og rifter]
        sufficiency: Sufficient alone for cleaning and protecting a contaminated abrasion.
    supporting_sources: []
    must_have_information:
      - Vask såret og huden rundt i lunkent vann eller sårvann; ved rusk/skitt kan vann med mild, nøytral og uparfymert såpe brukes.
      - Bruk plaster eller bandasje når det kan komme skitt i såret.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-02, section: Behandling av mindre blødingar og sår / Skrubbsår og rifter, quote: 'Vask såret og huda rundt såret i lunka vatn eller sårvatn.'}
          - {source_id: source-02, section: Behandling av mindre blødingar og sår / Skrubbsår og rifter, quote: 'Er det rusk og skit i såret, bør du bruke vatn med ei mild og nøytral såpe, utan parfyme.'}
      - item: 2
        all_of:
          - {source_id: source-02, section: Behandling av mindre blødingar og sår / Skrubbsår og rifter, quote: 'Små sår gror best utan plaster, men bruk plaster eller bandasje dersom du trur det kan kome skit i såret.'}
    acceptable_source_sections_or_chunks: [Passasjer som samlet gir rengjøring med nødvendige såpeforbehold og tildekking ved fare for skitt; ingen bestemt chunk eller støttekilde kreves.]
    optional_useful_information: [Rengjøring med hånddusj eller rent fuktig tøystykke.]
    irrelevant_or_potentially_misleading_information: [Akutt stor blødning eller indre blødning som hovedkontekst., Brannskadekjøling eller adrenalin som sårbehandling.]
    knowledge_gap: {status: bounded_limitations, details: [Kilden avgjør ikke tetanusstatus eller om det faktisk er dypere skade; spørsmålet gjelder overfladisk skrubbsår.]}
    gold_uncertainty: {requires_owner_judgement: false, notes: []}
    why_this_case_is_useful: Skiller rengjøring av lite forurenset sår fra nærliggende storblødningsprosedyrer og oversetter nynorsk til bokmål.

  - id: case-17
    title: Rask reaksjon etter insektstikk
    origin: development_addition
    review_status: pending_owner_review
    areas: [first_aid, emergency_prioritisation]
    difficulty: harder
    question: Etter et vepsestikk har turkameraten fått utslett flere steder, hovne lepper og sier at halsen kjennes trang. Det har kommet raskt. Er det noe vi kan vente med til vi er nede fra fjellet?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-08]
    preferred_source_sections:
      - source_id: source-08
        sections: [Allergisk sjokk og anafylaksi, Symptomer på allergisk sjokk, Årsaker til anafylaksi, Ring 113 umiddelbart ved allergisjokk]
        sufficiency: Covers symptom pattern, insect trigger and immediate escalation; no drug dose is required.
    supporting_sources: []
    must_have_information:
      - Rask reaksjon med hud-/slimhinnehevelse og trang hals/pustebesvær er blant symptomene på anafylaksi; insektstikk kan utløse den.
      - Mistanke om anafylaksi krever akutt behandling og umiddelbar kontakt med 113, ikke å vente til turen er ferdig.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-08, section: Symptomer på allergisk sjokk, quote: 'En alvorlig allergisk reaksjon utvikler seg raskt.'}
          - {source_id: source-08, section: Symptomer på allergisk sjokk, quote: 'Har du anafylaksi får du raskt symptomer fra flere organsystemer, for eksempel:'}
          - {source_id: source-08, section: Symptomer på allergisk sjokk, quote: 'hud og slimhinner hovner opp'}
          - {source_id: source-08, section: Symptomer på allergisk sjokk, quote: 'pustebesvær, hoste og en følelse av at halsen blir trangere'}
          - {source_id: source-08, section: Årsaker til anafylaksi, quote: 'insektstikk (bie- og vepsestikk)'}
      - item: 2
        all_of:
          - {source_id: source-08, section: Allergisk sjokk og anafylaksi, quote: 'Alvorlig allergisk reaksjon (anafylaksi) kan være livstruende og krever akutt behandling.'}
          - {source_id: source-08, section: Allergisk sjokk og anafylaksi, quote: 'Ved mistanke om anafylaksi, ring 113 øyeblikkelig.'}
    acceptable_source_sections_or_chunks: [Anvendelige passasjer må gi både det relevante symptommønsteret/utløseren og umiddelbar varsling ved mistanke; generell allergibeskrivelse alene er utilstrekkelig.]
    optional_useful_information: [113 gir veiledning., Tidligere diagnostiserte personer bør ha med adrenalinpenn og få opplæring fra lege.]
    irrelevant_or_potentially_misleading_information: [Lav dødelighet i all allergi brukt til å berolige ved akutte luftveissymptomer., Antihistamin fra pakkeliste som erstatning for akutt varsling., Oppdiktet dosering eller gjentakelsesintervall for adrenalin.]
    knowledge_gap: {status: bounded_limitations, details: [Kilden støtter mistanke og eskalering; faktisk diagnose og legemiddel-/pennspesifikk dose er ikke gold.]}
    gold_uncertainty: {requires_owner_judgement: false, notes: [Godkjenner ikke ny safety-policy eller individuell medisinering.]}
    why_this_case_is_useful: Nytt MVP-førstehjelpsbehov med symptomkobling på tvers av seksjoner, uten krav om modellbasert diagnose.

  - id: case-18
    title: Egenredning fra råk
    origin: development_addition
    review_status: pending_owner_review
    areas: [cold, natural_hazard, ice, rescue]
    difficulty: harder
    question: Jeg har gått gjennom isen på skøyter. Jeg holder meg i hullet og har ispigger, men kanten knekker når jeg prøver å dra meg opp. Hva sier rådene om å komme opp?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-19]
    preferred_source_sections:
      - source_id: source-19
        sections: [Redde seg selv]
        sufficiency: Two continuations jointly cover direction, weak edge and getting onto bearing ice.
    supporting_sources: []
    must_have_information:
      - Unngå at hodet kommer under vann, snu og prøv opp den veien du kom fra.
      - Bryt svak kant inn til solid is før du bruker kreftene på å dra deg opp.
      - Ved solid kant brukes armene/ispiggene og svømmetak med bena for å trekke/skyve seg inn på isen; minst én av de beskrevne metodene er tilstrekkelig.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-19, section: Redde seg selv, quote: 'Når du går gjennom isen må du kjempe for å unngå at hodet kommer under vann.'}
          - {source_id: source-19, section: Redde seg selv, quote: 'Snu deg rundt og prøv å komme opp den veien du kom i fra.'}
      - item: 2
        all_of:
          - {source_id: source-19, section: Redde seg selv, quote: 'Først bør man bryte seg vei inn til sikker is.'}
          - {source_id: source-19, section: Redde seg selv, quote: 'Svøm oppreist i vannet og legg albuene oppå isen for å brekke dårlig is langs kanten med tyngden din.'}
      - item: 3
        all_of:
          - {source_id: source-19, section: Redde seg selv, quote: 'Når kanten er solid er du klar for å komme deg opp.'}
          - {source_id: source-19, section: Redde seg selv, quote: 'Legg deg i svømmestilling og få armene opp på isen.'}
          - {source_id: source-19, section: Redde seg selv, quote: 'Bruk armene aktivt til å dra deg inn på isen som en sel, både med svømmetak med beina og med å dra deg inn etter ispiggene.'}
    acceptable_source_sections_or_chunks: [Begge tekstfortsettelsene eller andre kildestøttede kombinasjoner; begge oppstigningsmetodene kreves ikke., Metoden med å presse seg opp på albuene og vippe frem til kneet kommer opp er et likeverdig alternativ til sertifikatets svømmestilling.]
    optional_useful_information: [Etter oppstigning hindre videre nedkjøling med tørt tøy og isolasjon., Ispigger hjelper med feste på glatt is.]
    irrelevant_or_potentially_misleading_information: [Bare redning av andre eller generell istykkelse som erstatning for egenredning., Å trekke seg helt opp på kant som fortsetter å briste.]
    knowledge_gap: {status: bounded_limitations, details: [Instruksjonene finnes; de avgjør ikke faktisk bæreevne eller garanterer vellykket redning.]}
    gold_uncertainty: {requires_owner_judgement: false, notes: [Godta én fullstendig kildebeskrevet oppstigningsmetode; konservativ automatikk kjenner foreløpig bare én.]}
    why_this_case_is_useful: Krever handlingssekvens over to fortsettelser fremfor relevant overskrift alene.

