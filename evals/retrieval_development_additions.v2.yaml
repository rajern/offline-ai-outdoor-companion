  - id: case-21
    title: Vannfilter uten kokeutstyr
    origin: development_addition
    review_status: pending_owner_review
    areas: [water, hygiene]
    difficulty: harder
    question: Stormkjøkkenet er ødelagt. Vi har et filter merket absolutt 0,3 mikron og tabletter for desinfisering. Holder filteret alene mot alt som kan gjøre oss syke i bekkevannet, og i hvilken rekkefølge bruker vi utstyret?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-21]
    preferred_source_sections:
      - source_id: source-21
        sections: [Prevention steps and strategies / Treat your water, Prevention steps and strategies / Treat your water / Filter, Prevention steps and strategies / Treat your water / Disinfect]
        sufficiency: Specific filter limitation plus sequencing/product instructions suffice.
    supporting_sources: []
    must_have_information:
      - Filter med absolutt porestørrelse 0,3 mikron eller mindre fjerner bakterier og parasitter, men ikke virus.
      - Filtrer først og desinfiser det filtrerte vannet; følg produktets bruksanvisning.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-21, section: Prevention steps and strategies / Treat your water / Filter, quote: 'A filter with an absolute pore (hole) size of 0.3 micron or smaller will remove bacteria and parasites, but not viruses.'}
      - item: 2
        all_of:
          - {source_id: source-21, section: Prevention steps and strategies / Treat your water, quote: 'The next best option is to filter water and then disinfect the filtered water.'}
          - {source_id: source-21, section: Prevention steps and strategies / Treat your water, quote: 'Follow the instructions on any products you use to make sure they work properly to remove germs.'}
    acceptable_source_sections_or_chunks: [Passasjer som bevarer den oppgitte porestørrelsen/virusbegrensningen og hele sekvensen med produktforbehold; koking alene besvarer ikke spørsmålet.]
    optional_useful_information: [Koking er beste mikrobetiltak når det er mulig., Behandling gir ikke trygghet ved skadelige kjemikalier/giftstoffer., Klor og jod virker dårlig mot parasitter og erstatter ikke filtrering.]
    irrelevant_or_potentially_misleading_information: [Revers osmose brukt som om det beskriver dette filteret., Virusfjerning tilskrevet 0.3-mikronfilter., Tablettdose eller virketid uten produktinformasjon.]
    knowledge_gap: {status: bounded_limitations, details: [Generell metode er dekket; konkret tablettdose og tid avhenger av produkt og er ikke gold.]}
    gold_uncertainty: {requires_owner_judgement: false, notes: []}
    why_this_case_is_useful: Norsk spørsmål med tall og negasjon mot engelsk prosedyre, adskilt fra tidligere koke-case.

