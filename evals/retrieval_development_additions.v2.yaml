      - item: 2
        all_of:
          - {source_id: source-17, section: 'Det samme gjelder de andre i følget ditt. Alltid!', quote: 'Men du må kunne bruke utstyret også, selv under de verst tenkelige forhold.'}
          - {source_id: source-17, section: 'Det samme gjelder de andre i følget ditt. Alltid!', quote: 'Derfor må du øve med utstyret ditt.'}
    acceptable_source_sections_or_chunks: [Utstyrssetningen sammen med det faktisk leverte alle-i-følget-budskapet og øving; overskriften teller bare dersom den er levert i konteksten.]
    optional_useful_information: [Skredkurs gir introduksjon og må følges av videre øving.]
