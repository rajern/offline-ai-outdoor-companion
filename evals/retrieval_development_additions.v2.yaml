  - id: case-23
    title: Vente i lynsikkert ly
    origin: development_addition
    review_status: pending_owner_review
    areas: [weather, shelter, natural_hazard]
    difficulty: straightforward
    question: Vi har søkt inn i en solid bygning med strøm og vann etter tordenvær. Det har vært stille i ti minutter. Kan vi gå ut igjen, og er det noe inne vi bør holde oss unna mens vi venter?
    question_language: nb
    jurisdiction: 'NO'
    expected_result: supported_context
    relevant_sources: [source-22]
    preferred_source_sections:
      - source_id: source-22
        sections: ['Lightning: What You Need to Know', Indoor Lightning Safety]
        sufficiency: Waiting duration and two principal indoor contact hazards suffice.
    supporting_sources: []
    must_have_information:
      - Bli i ordentlig ly minst 30 minutter etter siste hørbare torden.
      - Unngå ledningstelefon og elektrisk utstyr som gir direkte elektrisk kontakt.
      - Unngå røranlegg som vasker, badekar og kraner mens uværet pågår.
    must_have_evidence:
      - item: 1
        all_of:
          - {source_id: source-22, section: 'Lightning: What You Need to Know', quote: 'Stay in safe shelter at least 30 minutes after you hear the last sound of thunder.'}
      - item: 2
        all_of:
          - {source_id: source-22, section: Indoor Lightning Safety, quote: 'Stay off corded phones, computers and other electrical equipment that put you in direct contact with electricity.'}
      - item: 3
        all_of:
          - {source_id: source-22, section: Indoor Lightning Safety, quote: 'Avoid plumbing, including sinks, baths and faucets.'}
    acceptable_source_sections_or_chunks: [Ventetid med korrekt startpunkt og innendørs risikoinstruksjoner må leveres; utendørs rygg/overheng alene er utilstrekkelig.]
    optional_useful_information: [Unngå vinduer/dører/veranda og betonggulv/-vegger slik kilden beskriver.]
    irrelevant_or_potentially_misleading_information: [Korte stillhetsperioder som klarsignal., Råd om telt eller overheng som erstatning for innendørsråd., Påstand om at batteridrevet telefon er forbudt basert på råd om ledningstelefon.]
    knowledge_gap: {status: bounded_limitations, details: [Generelle råd er dekket; faktisk værutvikling kan ikke fastslås fra KB.]}
