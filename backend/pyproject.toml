[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outwise-backend"
version = "0.1.0"
description = "Local FastAPI backend for Outwise"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.117",
    "uvicorn>=0.30,<0.36",
    "beautifulsoup4>=4.12,<5",
    "fastembed==0.7.4",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<0.29",
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
